<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta
    name="theme-color"
    content="#0d47a1"
  >
  <meta
    name="description"
    content="Birthday Reminder Web App"
  >

  <title>Birthday Reminder</title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >
  <link
    rel="icon"
    href="icons/icon-192.png"
  >
  <link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
  >
  <link
    rel="stylesheet"
    href="assets/style.css"
  >
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Birthday Reminder</p>
        <h1 id="pageTitle">Dashboard</h1>
      </div>

      <div class="top-actions">
        <button
          class="icon-button"
          id="installButton"
          type="button"
          title="Install app"
          hidden
        >
          ⬇
        </button>

        <button
          class="icon-button"
          id="refreshButton"
          type="button"
          title="Refresh"
        >
          ↻
        </button>
      </div>
    </header>

    <main class="content">
      <section
        id="connectionBanner"
        class="connection-banner"
        hidden
      ></section>

      <section
        id="dashboardView"
        class="view is-active"
      >
        <div class="hero-card">
          <div>
            <p class="hero-kicker">Next celebration</p>
            <h2 id="nextBirthdayName">
              No birthday loaded
            </h2>
            <p id="nextBirthdayMeta">
              Connect the app to your Apps Script API.
            </p>
          </div>

          <div class="hero-cake">
            🎂
          </div>
        </div>

        <div class="stats-grid">
          <article class="stat-card">
            <span>Total</span>
            <strong id="totalCount">0</strong>
          </article>

          <article class="stat-card today">
            <span>Today</span>
            <strong id="todayCount">0</strong>
          </article>

          <article class="stat-card upcoming">
            <span id="upcomingLabel">Next 7 days</span>
            <strong id="upcomingCount">0</strong>
          </article>
        </div>

        <div class="section-heading">
          <div>
            <p class="eyebrow">Coming up</p>
            <h2>Upcoming birthdays</h2>
          </div>

          <button
            class="text-button"
            data-nav="birthdays"
            type="button"
          >
            View all
          </button>
        </div>

        <div
          id="upcomingList"
          class="card-list"
        ></div>
      </section>

      <section
        id="birthdaysView"
        class="view"
      >
        <div class="toolbar">
          <label class="search-box">
            <span>⌕</span>
            <input
              id="birthdaySearch"
              type="search"
              placeholder="Search name, relation or number"
            >
          </label>

          <select id="genderFilter">
            <option value="">All genders</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">
              Prefer not to say
            </option>
          </select>
        </div>

        <div
          id="birthdayList"
          class="card-list"
        ></div>
      </section>

      <section
        id="yearlyView"
        class="view"
      >
        <div class="toolbar yearly-toolbar">
          <label>
            <span class="field-label">Birthday list year</span>
            <input
              id="yearInput"
              type="number"
              min="1900"
              max="2200"
            >
          </label>

          <button
            class="primary-button"
            id="loadYearButton"
            type="button"
          >
            Load year
          </button>
        </div>

        <div
          id="yearlyList"
          class="year-groups"
        ></div>
      </section>

      <section
        id="settingsView"
        class="view"
      >
        <form
          id="settingsForm"
          class="settings-card"
        >
          <h2>Connection</h2>

          <label>
            <span class="field-label">
              Apps Script Web App URL
            </span>
            <input
              id="apiUrlInput"
              type="url"
              placeholder="https://script.google.com/macros/s/.../exec"
              required
            >
          </label>

          <label>
            <span class="field-label">
              Web App access key
            </span>
            <input
              id="apiKeyInput"
              type="password"
              placeholder="Your private access key"
              required
            >
          </label>

          <h2>Birthday settings</h2>

          <label>
            <span class="field-label">
              Reminder days
            </span>
            <input
              id="reminderDaysInput"
              type="number"
              min="0"
              max="365"
              value="7"
            >
          </label>

          <label>
            <span class="field-label">
              Yearly list year
            </span>
            <input
              id="settingsYearInput"
              type="number"
              min="1900"
              max="2200"
            >
          </label>

          <label>
            <span class="field-label">
              Default country code
            </span>
            <input
              id="countryCodeInput"
              type="text"
              value="91"
              maxlength="4"
            >
          </label>

          <label>
            <span class="field-label">
              WhatsApp birthday message
            </span>
            <textarea
              id="whatsappMessageInput"
              rows="4"
              maxlength="500"
            ></textarea>
            <small>
              Use {name} and {date} placeholders.
            </small>
          </label>

          <div class="form-actions">
            <button
              class="secondary-button"
              id="testConnectionButton"
              type="button"
            >
              Test connection
            </button>

            <button
              class="primary-button"
              type="submit"
            >
              Save settings
            </button>
          </div>
        </form>
      </section>
    </main>

    <button
      class="fab"
      id="addBirthdayButton"
      type="button"
      aria-label="Add birthday"
    >
      +
    </button>

    <nav class="bottom-nav">
      <button
        class="nav-item is-active"
        data-nav="dashboard"
        type="button"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button
        class="nav-item"
        data-nav="birthdays"
        type="button"
      >
        <span>☷</span>
        <small>Birthdays</small>
      </button>

      <button
        class="nav-item"
        data-nav="yearly"
        type="button"
      >
        <span>▣</span>
        <small>Year</small>
      </button>

      <button
        class="nav-item"
        data-nav="settings"
        type="button"
      >
        <span>⚙</span>
        <small>Settings</small>
      </button>
    </nav>
  </div>

  <dialog id="birthdayDialog">
    <form
      id="birthdayForm"
      method="dialog"
      class="dialog-card"
    >
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Birthday record</p>
          <h2 id="dialogTitle">Add birthday</h2>
        </div>

        <button
          class="icon-button close-button"
          id="closeDialogButton"
          type="button"
        >
          ×
        </button>
      </div>

      <input
        id="recordIdInput"
        type="hidden"
      >

      <div class="form-grid">
        <label class="full">
          <span class="field-label">Name *</span>
          <input
            id="nameInput"
            type="text"
            maxlength="100"
            required
          >
        </label>

        <label>
          <span class="field-label">Gender *</span>
          <select
            id="genderInput"
            required
          >
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">
              Prefer not to say
            </option>
          </select>
        </label>

        <label>
          <span class="field-label">DOB *</span>
          <input
            id="dobInput"
            type="date"
            required
          >
        </label>

        <label>
          <span class="field-label">Mobile</span>
          <input
            id="mobileInput"
            type="tel"
            maxlength="30"
          >
        </label>

        <label>
          <span class="field-label">
            WhatsApp Number
          </span>
          <input
            id="whatsappInput"
            type="tel"
            maxlength="30"
          >
        </label>

        <label>
          <span class="field-label">Relation</span>
          <input
            id="relationInput"
            type="text"
          >
        </label>

        <label>
          <span class="field-label">Email</span>
          <input
            id="emailInput"
            type="email"
          >
        </label>

        <label class="full">
          <span class="field-label">Notes</span>
          <textarea
            id="notesInput"
            rows="3"
            maxlength="1000"
          ></textarea>
        </label>
      </div>

      <div class="form-actions">
        <button
          class="danger-button"
          id="deleteBirthdayButton"
          type="button"
          hidden
        >
          Delete
        </button>

        <span class="action-spacer"></span>

        <button
          class="secondary-button"
          id="cancelBirthdayButton"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          id="saveBirthdayButton"
          type="submit"
        >
          Save
        </button>
      </div>
    </form>
  </dialog>

  <div
    id="toast"
    class="toast"
    role="status"
  ></div>

  <script src="js/app.js"></script>
</body>
</html>
